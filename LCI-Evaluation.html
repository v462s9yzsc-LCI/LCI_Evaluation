<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCI Evaluation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<!-- Chart.js und QRCode werden bewusst NICHT hier fest geladen: sie werden nur im
     Admin-Bereich gebraucht. Für Teilnehmende (der weitaus häufigere Aufruf, oft
     über mobile Netze) würden sie das Laden der Seite unnötig verlangsamen.
     Stattdessen lädt sie loadScript() erst bei Bedarf, siehe weiter unten. -->
<style>
  :root{
    --blue:#264d98;
    --blue-dark:#152e63;
    --blue-pale:#eaeffb;
    --ink:#14161c;
    --gray:#6b7079;
    --gray-light:#f4f5f8;
    --line:#e3e5ea;
    --white:#ffffff;
    --good:#2f9668;
    --good-pale:#e6f5ee;
    --bad:#c0392b;
    --bad-pale:#fbeae8;
    --warn:#b6790a;
    --radius:14px;
    --shadow: 0 1px 2px rgba(20,22,28,.04), 0 8px 24px -12px rgba(20,22,28,.12);
    --maxw:640px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--gray-light);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:20px 18px 64px;flex:1;}
  .wrap.wide{max-width:920px;}

  /* Header */
  .topbar{
    background:var(--white);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .topbar-inner{max-width:var(--maxw);margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:10px;}
  .topbar-inner.wide{max-width:920px;}
  .logo-img{height:30px;width:auto;display:block;}
  .brand-tag{font-size:11px;color:var(--gray);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-left:1px solid var(--line);padding-left:10px;margin-left:2px;}
  .topbar-spacer{flex:1;}
  .back-link{font-size:13.5px;color:var(--blue);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px;}
  .back-link:hover{text-decoration:underline;}

  h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;letter-spacing:-.01em;margin:0 0 6px;color:var(--ink);}
  h2{font-size:18px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;}
  h3{font-size:14.5px;font-weight:700;margin:0;color:var(--ink);}
  p{margin:0 0 12px;color:var(--gray);font-size:14.5px;}
  .eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin:0 0 8px;}

  .card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .card.flush{padding:0;overflow:hidden;}
  .muted-card{background:var(--gray-light);border:1px dashed var(--line);border-radius:var(--radius);padding:16px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:inherit;font-size:14.5px;font-weight:600;letter-spacing:-.005em;
    padding:13px 20px;border-radius:11px;border:1px solid transparent;cursor:pointer;
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
    min-height:46px;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-primary:disabled{background:#aab4cf;cursor:not-allowed;}
  .btn-outline{background:#fff;color:var(--blue);border-color:var(--blue);}
  .btn-outline:hover{background:var(--blue-pale);}
  .btn-ghost{background:transparent;color:var(--gray);border-color:var(--line);}
  .btn-ghost:hover{background:var(--gray-light);}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 14px;font-size:13px;min-height:36px;border-radius:9px;}
  .btn-row{display:flex;gap:10px;margin-top:18px;}
  .btn-row .btn{flex:1;}

  label.field-label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px;color:var(--ink);}
  .hint{font-size:12.5px;color:var(--gray);margin-top:6px;}
  input[type=text], input[type=search]{
    width:100%;font-family:inherit;font-size:15.5px;padding:12px 14px;border-radius:10px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);
  }
  input[type=text]:focus, input[type=search]:focus, textarea:focus{
    outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-pale);
  }
  input.err{border-color:var(--bad);}
  textarea{
    width:100%;font-family:inherit;font-size:14.5px;padding:12px 14px;border-radius:10px;
    border:1.5px solid var(--line);resize:vertical;min-height:70px;background:#fff;color:var(--ink);
  }
  .field{margin-bottom:16px;}
  .err-text{color:var(--bad);font-size:12.5px;font-weight:600;margin-top:6px;display:none;}
  .err-text.show{display:block;}

  /* choice pills */
  .pill-group{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{
    padding:10px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;
    font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;user-select:none;transition:.12s;
  }
  .pill:hover{border-color:var(--blue);}
  .pill.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  /* yes/no */
  .yn-group{display:flex;gap:8px;}
  .yn-group .pill{flex:1;text-align:center;}

  /* scale */
  .scale-item{padding:16px 0;border-bottom:1px solid var(--line);}
  .scale-item:last-child{border-bottom:none;}
  .scale-item .q{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--ink);}
  .scale-row{display:flex;gap:6px;}
  .scale-btn{
    flex:1;aspect-ratio:1/1;max-height:46px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-weight:700;font-size:14px;color:var(--gray);cursor:pointer;transition:.12s;
    display:flex;align-items:center;justify-content:center;
  }
  .scale-btn:hover{border-color:var(--blue);}
  .scale-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .scale-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--gray);margin-top:6px;}

  /* progress */
  .progress-wrap{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
  .progress-track{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .25s ease;}
  .progress-label{font-size:11.5px;color:var(--gray);font-weight:700;white-space:nowrap;}

  .section-title{margin-bottom:2px;}
  .section-sub{font-size:12.5px;color:var(--gray);margin-bottom:16px;}

  /* home / choice tiles */
  .tile{
    display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--radius);
    border:1.5px solid var(--line);background:#fff;cursor:pointer;margin-bottom:12px;transition:.12s;
  }
  .tile:hover{border-color:var(--blue);box-shadow:var(--shadow);}
  .tile-icon{
    width:42px;height:42px;border-radius:11px;background:var(--blue-pale);color:var(--blue);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .tile-icon svg{width:21px;height:21px;}
  .tile-text b{display:block;font-size:15px;margin-bottom:2px;}
  .tile-text span{font-size:12.5px;color:var(--gray);}
  .tile-arrow{margin-left:auto;color:var(--gray);flex:none;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--blue-pale);color:var(--blue);}
  .badge.gray{background:var(--gray-light);color:var(--gray);}
  .privacy-note{display:flex;gap:10px;padding:14px 16px;border-radius:12px;background:var(--good-pale);margin-bottom:18px;}
  .privacy-note svg{flex:none;color:var(--good);width:18px;height:18px;margin-top:1px;}
  .privacy-note p{margin:0;color:#1f4f38;font-size:13px;}

  /* thank you */
  .center-state{text-align:center;padding:40px 10px;}
  .center-state .icon-circle{
    width:60px;height:60px;border-radius:50%;background:var(--good-pale);color:var(--good);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  }
  .center-state .icon-circle svg{width:28px;height:28px;}

  /* admin */
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .round-item{
    display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--radius);
    border:1px solid var(--line);background:#fff;margin-bottom:10px;cursor:pointer;transition:.12s;
  }
  .round-item:hover{border-color:var(--blue);box-shadow:var(--shadow);}
  .round-item .ri-main{flex:1;min-width:0;}
  .round-item b{font-size:14.5px;display:block;}
  .round-item .ri-sub{font-size:12.5px;color:var(--gray);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .round-item .ri-counts{display:flex;gap:6px;flex:none;}
  .count-chip{font-size:11px;font-weight:700;background:var(--gray-light);color:var(--ink);padding:4px 8px;border-radius:7px;}

  .link-box{
    display:flex;gap:8px;align-items:center;background:var(--gray-light);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-top:10px;
  }
  .link-box code{flex:1;font-size:12px;color:var(--blue-dark);overflow-x:auto;white-space:nowrap;font-family:'SF Mono',Consolas,monospace;}

  .tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px;}
  .tab{
    padding:9px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--gray);
    background:var(--gray-light);cursor:pointer;white-space:nowrap;border:1.5px solid transparent;
  }
  .tab.active{background:var(--blue-pale);color:var(--blue);border-color:var(--blue);}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:center;}
  .stat-box .num{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--blue);}
  .stat-box .lbl{font-size:11px;color:var(--gray);font-weight:600;margin-top:2px;}

  .dist-item{margin-bottom:12px;}
  .dist-item .dl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .dist-item .dl b{font-weight:700;}
  .dist-item .dl span{color:var(--gray);}
  .dist-bar-track{height:9px;background:var(--gray-light);border-radius:99px;overflow:hidden;}
  .dist-bar-fill{height:100%;background:var(--blue);border-radius:99px;}

  .chart-box{position:relative;margin:6px 0 22px;}
  .comment-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;}
  .comment{background:var(--gray-light);border-radius:10px;padding:11px 13px;font-size:13.5px;color:var(--ink);}
  .comment time{display:block;font-size:11px;color:var(--gray);margin-top:5px;font-weight:600;}
  .empty-note{font-size:13px;color:var(--gray);font-style:italic;padding:8px 0;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:.2s;z-index:100;box-shadow:var(--shadow);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .loading{display:flex;align-items:center;justify-content:center;padding:60px 0;color:var(--gray);font-size:14px;gap:10px;}
  .spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--blue);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .divider{height:1px;background:var(--line);margin:18px 0;}
  .section-header{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  .num-badge{width:22px;height:22px;border-radius:6px;background:var(--blue-pale);color:var(--blue);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}

  @media (max-width:420px){
    .wrap{padding:16px 14px 56px;}
    h1{font-size:22px;}
    .stat-grid{grid-template-columns:repeat(3,1fr);gap:7px;}
    .stat-box{padding:10px 6px;}
    .stat-box .num{font-size:19px;}
  }
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => { delete _loadedScripts[src]; reject(new Error('Skript konnte nicht geladen werden: '+src)); };
    document.head.appendChild(s);
  });
  return _loadedScripts[src];
}

/* ============================= STORAGE HELPERS (Google Sheets backend) =============================
   Diese App speichert NICHT im Claude-Speicher (der verlangt ein Claude-Konto), sondern in einem
   eigenen Google Sheet über ein kostenloses Google Apps Script Web App. Teilnehmer benötigen dafür
   kein Konto. Bitte die Web-App-URL nach dem Deployment hier eintragen: */
const API_URL = 'https://script.google.com/macros/s/AKfycbwm5jzXrYoArVAmvskFj1dMmU9c67NINuZygbEhd5v_aPzFr7XnU4uMtNkxawhjQQ/exec';

function apiConfigured(){ return API_URL && API_URL.indexOf('https://script.google.com') === 0; }

async function apiGetSheet(sheet, token){
  if (!apiConfigured()) return [];
  try{
    let url = API_URL + '?sheet=' + encodeURIComponent(sheet) + '&t=' + Date.now();
    if (token) url += '&token=' + encodeURIComponent(token);
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    if (data && !Array.isArray(data) && data.error === 'unauthorized'){ S._authFailed = true; return []; }
    return Array.isArray(data) ? data : [];
  }catch(e){ console.error('apiGetSheet failed', sheet, e); return []; }
}
async function apiAppend(sheet, record){
  if (!apiConfigured()) return null;
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
      body: JSON.stringify({ sheet, record })
    });
    return await res.json();
  }catch(e){ console.error('apiAppend failed', sheet, e); return null; }
}
async function apiDeleteRound(roundId, token){
  if (!apiConfigured()) return null;
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'deleteRound', roundId, token })
    });
    return await res.json();
  }catch(e){ console.error('apiDeleteRound failed', e); return null; }
}
async function apiDeleteResponses(sheet, ids, token){
  if (!apiConfigured()) return null;
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'deleteResponses', sheet, ids, token })
    });
    return await res.json();
  }catch(e){ console.error('apiDeleteResponses failed', e); return null; }
}

function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}
function shortId(id){ return id.split('-')[0]; }
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}) + ', ' +
         d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) + ' Uhr';
}
function norm(s){ return (s||'').trim().toLowerCase().replace(/\s+/g,' '); }

/* Ein-Gerät-Sperre: verhindert, dass dieselbe Person auf demselben Handy/Browser
   zweimal für denselben Kurs / dieselbe Lehrkraft abstimmt. Da die Evaluation
   komplett anonym ist (kein Login), ist dies keine 100%-sichere Identitätsprüfung,
   sondern ein praktischer Schutz gegen versehentliche Doppelabgaben. */
function doneKey(kind, roundId, dozentSlug){
  return 'lci_done_' + kind + '_' + roundId + (dozentSlug ? '_'+dozentSlug : '');
}
function hasSubmitted(kind, roundId, dozentSlug){
  try{ return localStorage.getItem(doneKey(kind, roundId, dozentSlug)) === '1'; }
  catch(e){ return false; }
}
function markSubmitted(kind, roundId, dozentSlug){
  try{ localStorage.setItem(doneKey(kind, roundId, dozentSlug), '1'); }
  catch(e){}
}
function esc(s){
  return (s==null?'':String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

async function createRound(data){
  const id = uid();
  const round = {
    id,
    kursnummer: data.kursnummer.trim(),
    kursname: data.kursname.trim(),
    dozent1: data.dozent1.trim(),
    dozent2: data.dozent2.trim(),
    validWeeks: Number(data.validWeeks) || 0,
    createdAt: Date.now()
  };
  await apiAppend('rounds', round);
  return normalizeRound(round);
}

function normalizeRound(row){
  const createdAt = Number(row.createdAt) || 0;
  const validWeeks = Number(row.validWeeks) || 0;
  const expiresAt = validWeeks > 0 ? createdAt + validWeeks*7*24*60*60*1000 : null;
  return {
    id: row.id,
    kursnummer: row.kursnummer || '',
    kursname: row.kursname || '',
    dozenten: [row.dozent1, row.dozent2].filter(Boolean),
    validWeeks,
    expiresAt,
    createdAt
  };
}
function isExpired(round){ return round.expiresAt != null && Date.now() > round.expiresAt; }
function fmtExpiry(round){
  if (!round.expiresAt) return 'unbegrenzt gültig';
  return (isExpired(round) ? 'abgelaufen am ' : 'gültig bis ') + fmtDate(round.expiresAt);
}

async function loadRounds(){
  const rows = await apiGetSheet('rounds');
  const rounds = rows.filter(r=>r.id).map(normalizeRound);
  rounds.sort((a,b)=> b.createdAt - a.createdAt);
  return rounds;
}

async function loadRound(id){
  const rounds = await loadRounds();
  return rounds.find(r=>r.id===id) || null;
}

async function saveResponse(roundId, type, dozentName, answers){
  const sheet = type === 'course' ? 'course_responses' : 'teacher_responses';
  const record = Object.assign({
    id: uid(),
    roundId,
    kursnummer: (answers.__kursnummer||'').trim(),
    timestamp: Date.now()
  }, type !== 'course' ? { dozentName: dozentName||'', dozentSlug: slug(dozentName||'') } : {});
  Object.keys(answers).forEach(k=>{ if (k !== '__kursnummer') record[k] = answers[k]; });
  const result = await apiAppend(sheet, record);
  if (!result || result.ok !== true){
    throw new Error('save failed'); // Netzwerkfehler nicht stillschweigend als Erfolg behandeln
  }
  return record;
}

function rowToResponse(row){
  const answers = {};
  Object.keys(row).forEach(k=>{
    if (!['id','roundId','kursnummer','timestamp','dozentName','dozentSlug'].includes(k)) answers[k] = row[k];
  });
  return {
    id: row.id || null,
    roundId: row.roundId,
    dozentName: row.dozentName || null,
    kursnummer: row.kursnummer || '',
    timestamp: Number(row.timestamp) || 0,
    answers
  };
}

async function loadResponses(roundId, type, dozentSlugFilter){
  const sheet = type === 'course' ? 'course_responses' : 'teacher_responses';
  const rows = await apiGetSheet(sheet, S.adminToken);
  let items = rows.filter(r=> r.roundId === roundId);
  if (dozentSlugFilter) items = items.filter(r=> r.dozentSlug === dozentSlugFilter);
  items = items.map(rowToResponse);
  items.sort((a,b)=> a.timestamp - b.timestamp);
  return items;
}

async function loadAllResponsesForRound(round){
  const course = await loadResponses(round.id, 'course');
  const t0 = round.dozenten[0] ? await loadResponses(round.id, 'teacher', slug(round.dozenten[0])) : [];
  const t1 = round.dozenten[1] ? await loadResponses(round.id, 'teacher', slug(round.dozenten[1])) : [];
  return { course, t0, t1 };
}
async function loadReviewedSignatures(roundId){
  const rows = await apiGetSheet('reviewed_clusters', S.adminToken);
  const set = new Set();
  rows.filter(r=>r.roundId===roundId).forEach(r=>{ if (r.sheet && r.signature) set.add(r.sheet+'|'+r.signature); });
  return set;
}
function slug(name){ return norm(name).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Link kopiert.')).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Link kopiert.'); }catch(e){ toast('Kopieren nicht möglich.'); }
  document.body.removeChild(ta);
}

async function submitCreateRound(){
  const kursnummer = document.getElementById('f_kursnummer').value;
  const kursname = document.getElementById('f_kursname').value;
  const dozent1 = document.getElementById('f_dozent1').value;
  const dozent2 = document.getElementById('f_dozent2').value;
  const validWeeks = document.getElementById('f_validweeks').value;

  let ok = true;
  const errKursnummerEl = document.getElementById('err_kursnummer');
  const kursnummerEl = document.getElementById('f_kursnummer');
  errKursnummerEl.classList.toggle('show', !kursnummer.trim());
  kursnummerEl.classList.toggle('err', !kursnummer.trim());
  if (!kursnummer.trim()) ok = false;
  document.getElementById('err_dozent1').classList.toggle('show', !dozent1.trim());
  document.getElementById('f_dozent1').classList.toggle('err', !dozent1.trim());
  if (!dozent1.trim()) ok = false;
  if (!ok) return;

  // Doppelte Kursnummer verhindern (gegen den aktuellen Stand aller Runden prüfen)
  const existing = await loadRounds();
  const dup = existing.some(r=> norm(r.kursnummer) === norm(kursnummer));
  if (dup){
    errKursnummerEl.textContent = 'Diese Kursnummer wurde bereits für eine Evaluation verwendet. Bitte eine andere Kursnummer wählen.';
    errKursnummerEl.classList.add('show');
    kursnummerEl.classList.add('err');
    return;
  }
  errKursnummerEl.textContent = 'Bitte geben Sie eine Kursnummer ein.';

  const round = await createRound({kursnummer, kursname, dozent1, dozent2, validWeeks});
  S.rounds.unshift(round);
  await openRoundDetail(round.id, true);
}

/* ============================= DOPPEL-ABGABEN ERKENNEN ============================= */
/* Erkennt Antworten, die inhaltlich exakt mit einer anderen Abgabe für dieselbe
   Kursnummer/Lehrkraft innerhalb weniger Sekunden übereinstimmen — typisches Muster
   eines Mehrfach-Tippens auf "Absenden" bei langsamer Verbindung, nicht zweier
   verschiedener Personen mit zufällig identischen Antworten. */
function sameAnswers(a, b){
  const keys = new Set([...Object.keys(a.answers||{}), ...Object.keys(b.answers||{})]);
  for (const k of keys){
    const av = a.answers[k], bv = b.answers[k];
    if (String(av==null?'':av) !== String(bv==null?'':bv)) return false;
  }
  return true;
}
function findDuplicateGroups(data, windowMs){
  // Absichtlich eng: ein echter Doppel-Tap passiert innerhalb weniger Sekunden
  // (derselbe Finger, derselbe Moment). Zwei verschiedene Personen mit zufällig
  // identischen Antworten treffen so gut wie nie exakt dieselbe Sekunde —
  // ein zu großzügiges Zeitfenster würde bei vielen zeitgleichen echten
  // Abgaben (z. B. 20 Personen im selben 10-Minuten-Fenster) zu Fehlalarmen
  // führen und im schlimmsten Fall echte, unterschiedliche Antworten löschen.
  windowMs = windowMs || 20*1000;
  const sorted = data.slice().sort((a,b)=>a.timestamp-b.timestamp);
  const used = new Set();
  const groups = [];
  for (let i=0;i<sorted.length;i++){
    if (used.has(i)) continue;
    const cluster = [sorted[i]];
    for (let j=i+1;j<sorted.length;j++){
      if (used.has(j)) continue;
      // WICHTIG: "break", nicht "continue" — sorted ist zeitlich aufsteigend sortiert,
      // sobald ein Eintrag außerhalb des Zeitfensters liegt, liegen alle folgenden
      // Einträge erst recht außerhalb. Ein "continue" hätte (Bug, jetzt behoben) die
      // Suche über das ganze restliche Zeitfenster fortgesetzt statt hier zu stoppen.
      if (sorted[j].timestamp - sorted[i].timestamp > windowMs) break;
      if (sorted[j].kursnummer === sorted[i].kursnummer &&
          sorted[j].dozentName === sorted[i].dozentName &&
          sameAnswers(sorted[i], sorted[j])){
        cluster.push(sorted[j]);
        used.add(j);
      }
    }
    if (cluster.length > 1){ used.add(i); groups.push(cluster); }
  }
  return groups; // jede Gruppe zeitlich aufsteigend sortiert: [0] bleibt, Rest wird entfernt
}

function renderDuplicateWarning(info){
  const sheet = info.type === 'course' ? 'course_responses' : 'teacher_responses';
  const rawGroups = findDuplicateGroups(info.data);
  const reviewed = S.reviewedSignatures || new Set();
  const groups = rawGroups.filter(g=>{
    const sig = g.map(r=>r.id).sort().join('|');
    return !reviewed.has(sheet+'|'+sig);
  });
  S._dupGroups = groups.map(g=>({ sheet, cluster:g, signature:g.map(r=>r.id).sort().join('|') }));
  if (!groups.length) return '';

  const cards = S._dupGroups.map((entry, idx)=>{
    const g = entry.cluster;
    const times = g.map(r=>new Date(r.timestamp).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})).join(' · ');
    return `<div class="muted-card" style="border-color:var(--warn);margin-bottom:10px">
      <div style="font-size:12.5px;color:var(--ink);margin-bottom:10px"><b>Kursnummer ${esc(g[0].kursnummer)}</b> — ${g.length}× identische Abgabe um ${times} Uhr</div>
      <div class="btn-row" style="margin-top:0">
        <button class="btn btn-outline btn-sm" style="border-color:var(--warn);color:var(--warn)" onclick="removeDuplicateGroup(${idx})">Duplikate entfernen (${g.length-1})</button>
        <button class="btn btn-ghost btn-sm" onclick="markGroupReviewed(${idx})">Geprüft — alle ${g.length} behalten</button>
      </div>
    </div>`;
  }).join('');

  return `<div class="card" style="border-color:var(--warn);background:#fff9ef">
    <h3 style="color:var(--warn);margin-bottom:8px">⚠ Mögliche Doppel-Abgaben erkannt</h3>
    <p style="margin-bottom:12px">Diese Gruppen enthalten Antworten, die inhaltlich exakt mit einer anderen Abgabe für dieselbe Kursnummer innerhalb weniger Sekunden übereinstimmen. Bitte für jede Gruppe einzeln entscheiden: Sprechen die Uhrzeiten (nur Sekunden auseinander) für einen Doppel-Tap derselben Person → „Duplikate entfernen". Könnten es stattdessen zwei verschiedene Personen mit zufällig/absichtlich identischen Antworten sein → „Geprüft — alle behalten". Eine als geprüft markierte Gruppe wird danach nicht erneut gemeldet.</p>
    ${cards}
  </div>`;
}

async function removeDuplicateGroup(idx){
  const entry = S._dupGroups && S._dupGroups[idx];
  if (!entry) return;
  const g = entry.cluster;
  const keepTime = new Date(g[0].timestamp).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const ok = window.confirm(`${g.length-1} doppelte Antwort(en) in dieser Gruppe entfernen?\n\nDie früheste Abgabe (${keepTime} Uhr) bleibt erhalten. Dies kann nicht rückgängig gemacht werden.`);
  if (!ok) return;
  const ids = g.slice(1).map(r=>r.id).filter(Boolean);
  if (!ids.length){ toast('Keine löschbaren Einträge gefunden (fehlende ID).'); return; }
  toast('Wird entfernt …');
  const result = await apiDeleteResponses(entry.sheet, ids, S.adminToken);
  if (!result || result.ok !== true){
    const reason = result && result.error === 'unauthorized'
      ? 'Admin-Passwort wurde vom Server abgelehnt.'
      : (result ? `Serverantwort: ${JSON.stringify(result)}` : 'Keine Antwort vom Server erhalten (Code.gs vermutlich noch nicht aktualisiert/neu bereitgestellt, oder Netzwerkproblem).');
    window.alert(`Die Duplikate konnten NICHT entfernt werden.\n\n${reason}`);
    return;
  }
  toast(`${result.deleted||0} Duplikat(e) entfernt.`);
  await openRoundDetail(S.currentRound.id);
}

async function markGroupReviewed(idx){
  const entry = S._dupGroups && S._dupGroups[idx];
  if (!entry) return;
  const ok = window.confirm(`Diese ${entry.cluster.length} Abgaben als geprüft markieren und alle behalten?\n\nSie werden danach nicht mehr als mögliches Duplikat angezeigt.`);
  if (!ok) return;
  toast('Wird gespeichert …');
  const result = await apiAppend('reviewed_clusters', {
    id: uid(), roundId: S.currentRound.id, sheet: entry.sheet, signature: entry.signature, reviewedAt: Date.now()
  });
  if (!result || result.ok !== true){
    window.alert(`Konnte nicht gespeichert werden.\n\n${result ? 'Serverantwort: '+JSON.stringify(result) : 'Keine Antwort vom Server.'}`);
    return;
  }
  toast('Als geprüft markiert.');
  await openRoundDetail(S.currentRound.id);
}

function renderDetailContent(){
  const info = currentTabInfo();
  const n = info.data.length;
  const last = n ? info.data[info.data.length-1].timestamp : null;

  let out = renderDuplicateWarning(info);
  out += `<div class="stat-grid">
    <div class="stat-box"><div class="num">${n}</div><div class="lbl">Antworten</div></div>
    <div class="stat-box"><div class="num">${info.sections.reduce((a,s)=>a+s.items.length,0)}</div><div class="lbl">Fragen</div></div>
    <div class="stat-box"><div class="num" style="font-size:14px;padding-top:5px">${last? fmtDate(last).split(',')[0] : '–'}</div><div class="lbl">Letzte Antwort</div></div>
  </div>`;

  if (n === 0){
    out += `<div class="muted-card"><p style="margin:0">Für „${esc(info.label)}“ liegen noch keine Antworten vor. Sobald Teilnehmer:innen über den Link abstimmen, erscheint hier automatisch die Auswertung.</p></div>`;
    return out + exportButtons();
  }

  info.sections.forEach((sec, si)=>{
    out += `<div class="card">
      <div class="section-header"><div class="num-badge">${si+1}</div><h3>${esc(sec.title)}</h3></div>
      <div class="section-sub">&nbsp;</div>`;

    if (sec.scaleType){
      out += `<div class="chart-box"><canvas id="chart-${sec.id}" height="60"></canvas></div>`;
    } else {
      sec.items.forEach(item=>{
        const itype = item.type || 'choice';
        if (itype === 'choice' || itype === 'choice_other'){
          out += renderChoiceDist(item, info.data);
        } else if (itype === 'yesno'){
          out += renderYesNoDist(item, info.data);
        } else if (itype === 'yesno_text'){
          out += renderYesNoDist(item, info.data);
          out += renderTextList(item.id, info.data, item.textLabel || 'Anmerkung');
        } else if (itype === 'text'){
          out += renderTextList(item.id, info.data, item.label);
        }
      });
    }
    out += `</div>`;
  });

  return out + exportButtons();
}

function exportButtons(){
  return `<div class="btn-row">
    <button class="btn btn-outline btn-sm" onclick="exportCSV()">${ICONS.download} Diese Ansicht als CSV</button>
  </div>`;
}

function renderChoiceDist(item, data){
  const opts = item.options;
  const counts = {}; opts.forEach(o=>counts[o[0]]=0);
  let otherTexts = [];
  let total = 0;
  data.forEach(r=>{
    const v = r.answers[item.id];
    if (v == null || v==='') return;
    total++;
    if (counts.hasOwnProperty(v)) counts[v]++;
    if (v === 'andere' || v === 'sonstiges'){
      const t = r.answers[item.id+'_text'];
      if (t) otherTexts.push({text:t, timestamp:r.timestamp});
    }
  });
  let rows = opts.map(([val,lbl])=>{
    const c = counts[val]||0;
    const pct = total ? Math.round(c/total*100) : 0;
    return `<div class="dist-item">
      <div class="dl"><b>${esc(lbl)}</b><span>${c} · ${pct}%</span></div>
      <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  let block = `<div style="margin:14px 0 18px"><div class="q" style="font-size:14px;font-weight:600;margin-bottom:10px">${esc(item.label)}</div>${rows}`;
  if (otherTexts.length){
    block += `<div style="margin-top:10px" class="comment-list">${otherTexts.map(t=>`<div class="comment">${esc(t.text)}<time>${fmtDate(t.timestamp)}</time></div>`).join('')}</div>`;
  }
  block += `</div>`;
  return block;
}

function renderYesNoDist(item, data){
  let ja=0, nein=0, total=0;
  data.forEach(r=>{
    const v = r.answers[item.id];
    if (v==='ja'){ja++;total++;} else if (v==='nein'){nein++;total++;}
  });
  const jaPct = total? Math.round(ja/total*100):0;
  const neinPct = total? Math.round(nein/total*100):0;
  const jaColor = item.invertColors ? 'var(--bad)' : 'var(--good)';
  const neinColor = item.invertColors ? 'var(--good)' : 'var(--bad)';
  return `<div style="margin:14px 0 18px">
    <div class="q" style="font-size:14px;font-weight:600;margin-bottom:10px">${esc(item.label)}</div>
    <div class="dist-item"><div class="dl"><b>Ja</b><span>${ja} · ${jaPct}%</span></div><div class="dist-bar-track"><div class="dist-bar-fill" style="width:${jaPct}%;background:${jaColor}"></div></div></div>
    <div class="dist-item"><div class="dl"><b>Nein</b><span>${nein} · ${neinPct}%</span></div><div class="dist-bar-track"><div class="dist-bar-fill" style="width:${neinPct}%;background:${neinColor}"></div></div></div>
  </div>`;
}

function renderTextList(itemId, data, label){
  const texts = data.map(r=>({text:r.answers[itemId], timestamp:r.timestamp})).filter(t=>t.text && t.text.trim());
  return `<div style="margin:14px 0 18px">
    <div class="q" style="font-size:14px;font-weight:600;margin-bottom:10px">${esc(label)}</div>
    ${texts.length ? `<div class="comment-list">${texts.map(t=>`<div class="comment">${esc(t.text)}<time>${fmtDate(t.timestamp)}</time></div>`).join('')}</div>` : `<div class="empty-note">Keine Angaben.</div>`}
  </div>`;
}

let _chartInstances = [];
async function renderAdminCharts(){
  _chartInstances.forEach(c=>{ try{c.destroy();}catch(e){} });
  _chartInstances = [];
  const info = currentTabInfo();
  if (!info.data.length) return;
  if (typeof Chart === 'undefined'){
    try{ await loadScript(CHART_JS_URL); }catch(e){ console.error(e); return; }
    // Falls der Nutzer inzwischen weitergeklickt hat, nicht mehr auf einer alten Ansicht zeichnen
    if (S.view !== 'admin_detail') return;
  }
  const scaleN = info.sections.some(s=>s.scaleType==='scale5') ? 5 : 4;
  const leftLbl = scaleN===5 ? SCALE5_LABELS.left : SCALE4_LABELS.left;
  const rightLbl = scaleN===5 ? SCALE5_LABELS.right : SCALE4_LABELS.right;

  info.sections.forEach(sec=>{
    if (!sec.scaleType) return;
    const labels = [];
    const values = [];
    sec.items.forEach(item=>{
      const vals = info.data.map(r=>r.answers[item.id]).filter(v=>typeof v==='number');
      if (!vals.length) return;
      const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
      labels.push(item.label.length>46 ? item.label.slice(0,44)+'…' : item.label);
      values.push(+avg.toFixed(2));
    });
    const canvas = document.getElementById(`chart-${sec.id}`);
    if (!canvas) return;
    canvas.height = Math.max(60, labels.length*34);
    const ctx = canvas.getContext('2d');
    const chart = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets:[{ data: values, backgroundColor:'#264d98', borderRadius:5, barThickness:16 }]},
      options: {
        indexAxis:'y',
        responsive:true,
        maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(c)=> 'Ø '+c.raw+' von '+scaleN}} },
        scales:{
          x:{ min:1, max:scaleN, ticks:{stepSize:1, font:{size:10}}, grid:{color:'#e3e5ea'},
              title:{display:true, text:`${leftLbl}  ←  Ø  →  ${rightLbl}`, font:{size:10, weight:'600'}, color:'#6b7079'} },
          y:{ ticks:{font:{size:11.5}}, grid:{display:false} }
        }
      }
    });
    _chartInstances.push(chart);
  });
}

/* CSV / JSON export */
function toCSV(rows, columns){
  const head = columns.map(csvEscapeField).join(';');
  const body = rows.map(r=> columns.map(c=>csvEscapeField(r[c])).join(';')).join('\n');
  return head+'\n'+body;
}
function csvEscapeField(v){
  if (v==null) v='';
  v = String(v).replace(/"/g,'""');
  return /["\n;]/.test(v) ? `"${v}"` : v;
}
function csvLine(fields){ return fields.map(csvEscapeField).join(';'); }

function buildSummaryCSVLines(info){
  const lines = [];
  lines.push(csvLine([`ZUSAMMENFASSUNG — ${info.label}`, '', '']));
  lines.push(csvLine([`Anzahl Antworten: ${info.data.length}`, '', '']));
  lines.push('');
  lines.push(csvLine(['Abschnitt','Frage','Auswertung']));
  info.sections.forEach(sec=>{
    if (sec.scaleType){
      const scaleN = sec.scaleType==='scale5' ? 5 : 4;
      sec.items.forEach(item=>{
        const vals = info.data.map(r=>r.answers[item.id]).filter(v=>typeof v==='number');
        if (!vals.length){ lines.push(csvLine([sec.title, item.label, 'keine Antworten'])); return; }
        const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
        lines.push(csvLine([sec.title, item.label, `Ø ${avg.toFixed(2)} von ${scaleN}  (n=${vals.length})`]));
      });
    } else {
      sec.items.forEach(item=>{
        const itype = item.type || 'choice';
        if (itype==='choice' || itype==='choice_other'){
          const total = info.data.filter(r=>r.answers[item.id]).length;
          item.options.forEach(([val,lbl])=>{
            const count = info.data.filter(r=>r.answers[item.id]===val).length;
            const pct = total ? Math.round(count/total*100) : 0;
            lines.push(csvLine([sec.title, item.label+' — '+lbl, `${count}  (${pct}%)`]));
          });
        } else if (itype==='yesno' || itype==='yesno_text'){
          const ja = info.data.filter(r=>r.answers[item.id]==='ja').length;
          const nein = info.data.filter(r=>r.answers[item.id]==='nein').length;
          const total = ja+nein;
          lines.push(csvLine([sec.title, item.label+' — Ja', `${ja}  (${total?Math.round(ja/total*100):0}%)`]));
          lines.push(csvLine([sec.title, item.label+' — Nein', `${nein}  (${total?Math.round(nein/total*100):0}%)`]));
        } else if (itype==='text'){
          const count = info.data.filter(r=>r.answers[item.id] && String(r.answers[item.id]).trim()).length;
          lines.push(csvLine([sec.title, item.label, `${count} Freitext-Antworten — siehe Einzelantworten unten`]));
        }
      });
    }
  });
  return lines;
}

function download(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportCSV(){
  const info = currentTabInfo();
  const cols = ['timestamp','kursnummer'];
  if (info.type==='teacher') cols.push('dozentName');
  info.sections.forEach(sec=>sec.items.forEach(it=>{
    cols.push(it.id);
    if (it.type==='choice_other') cols.push(it.id+'_text');
    if (it.type==='yesno_text') cols.push(it.id+'_text');
  }));
  const rows = info.data.map(r=>{
    const row = { timestamp: fmtDate(r.timestamp), kursnummer: r.kursnummer, dozentName: r.dozentName };
    Object.assign(row, r.answers);
    return row;
  });

  const summary = buildSummaryCSVLines(info).join('\n');
  const detail = csvLine(['EINZELANTWORTEN','','']) + '\n' + toCSV(rows, cols);
  // \uFEFF (BOM) sorgt dafür, dass Excel Umlaute (ä, ö, ü) korrekt anzeigt
  const csv = '\uFEFF' + summary + '\n\n' + detail;
  download(`evaluation_${S.currentRound.kursnummer}_${info.label}.csv`.replace(/\s+/g,'_'), csv, 'text/csv;charset=utf-8');
}
function exportJSON(){
  const payload = { round:S.currentRound, responses:S.responses };
  download(`evaluation_${S.currentRound.kursnummer}.json`.replace(/\s+/g,'_'), JSON.stringify(payload,null,2), 'application/json');
}

function renderWizard(){

function renderSectionStep(){
  const w = S.wizard;
  const sec = w.sections[w.step];
  const scaleN = sec.scaleType === 'scale5' ? 5 : (sec.scaleType === 'scale4' ? 4 : null);
  const labels = scaleN===5 ? SCALE5_LABELS : SCALE4_LABELS;

  let body = '';
  sec.items.forEach(item=>{
    if (item.showIf && !item.showIf(w.answers)) return;
    const itype = item.type || (sec.scaleType ? 'scale' : 'choice');
    if (itype === 'scale'){
      const cur = w.answers[item.id];
      body += `<div class="scale-item">
        <div class="q">${esc(item.label)}</div>
        <div class="scale-row">
          ${Array.from({length:scaleN},(_,i)=>i+1).map(n=>`<button type="button" class="scale-btn ${cur===n?'active':''}" onclick="setScale('${item.id}',${n})">${n}</button>`).join('')}
        </div>
        <div class="scale-ends"><span>${labels.left}</span><span>${labels.right}</span></div>
      </div>`;
    } else if (itype === 'choice'){
      body += choiceBlock(item);
    } else if (itype === 'choice_other'){
      body += choiceBlock(item, true);
    } else if (itype === 'yesno'){
      body += yesNoBlock(item);
    } else if (itype === 'yesno_text'){
      body += yesNoBlock(item, true);
    } else if (itype === 'text'){
      body += `<div class="field">
        <label class="field-label">${esc(item.label)}</label>
        <textarea id="f_${item.id}" oninput="setText('${item.id}', this.value)">${esc(w.answers[item.id]||'')}</textarea>
      </div>`;
    }
  });

  return `
  <div class="section-title"><h2>${esc(sec.title)}</h2></div>
  ${scaleN ? scaleLegend(scaleN, labels) : ''}
  <div class="card">${body}</div>
  <div class="err-text ${w.errors.section?'show':''}" style="margin-bottom:10px">Bitte beantworten Sie alle Fragen dieses Abschnitts.</div>
  <div class="btn-row">
    <button class="btn btn-outline" onclick="wizardBack()">Zurück</button>
    <button class="btn btn-primary" onclick="wizardNext()">Weiter</button>
  </div>`;
}

function scaleLegend(scaleN, labels){
  const colors = scaleN===5
    ? ['#2f9668','#7fb88a','#b6790a','#d98a5a','#c0392b']
    : ['#2f9668','#7fb88a','#d9a441','#c0392b'];
  const items = labels.points.map((p,i)=>`
    <div style="display:flex;align-items:center;gap:7px;flex:1;min-width:0">
      <div style="width:22px;height:22px;border-radius:7px;background:${colors[i]};color:#fff;font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center;flex:none">${i+1}</div>
      <span style="font-size:11.5px;color:var(--gray);line-height:1.2">${esc(p)}</span>
    </div>`).join('');
  return `<div class="muted-card" style="margin-bottom:14px;padding:12px 14px">
    <div style="font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:9px">So funktioniert die Skala:</div>
    <div style="display:flex;flex-wrap:wrap;gap:9px 14px">${items}</div>
  </div>`;
}

function choiceBlock(item, withOther){
  const w = S.wizard;
  const cur = w.answers[item.id];
  const showOther = withOther && (cur === 'andere' || cur === 'sonstiges');
  return `<div class="field">
    <label class="field-label">${esc(item.label)}</label>
    <div class="pill-group">
      ${item.options.map(([val,lbl])=>`<div class="pill ${cur===val?'active':''}" onclick="setChoice('${item.id}','${val}')">${esc(lbl)}</div>`).join('')}
    </div>
    ${showOther ? `<textarea style="margin-top:10px" placeholder="Bitte kurz erläutern" oninput="setText('${item.id}_text', this.value)">${esc(w.answers[item.id+'_text']||'')}</textarea>` : ''}
  </div>`;
}
function yesNoBlock(item, withText){
  const w = S.wizard;
  const cur = w.answers[item.id];
  const showText = withText && cur === 'ja';
  return `<div class="field">
    <label class="field-label">${esc(item.label)}</label>
    <div class="yn-group">
      <div class="pill ${cur==='ja'?'active':''}" onclick="setChoice('${item.id}','ja')">Ja</div>
      <div class="pill ${cur==='nein'?'active':''}" onclick="setChoice('${item.id}','nein')">Nein</div>
    </div>
    ${showText ? `<textarea style="margin-top:10px" placeholder="${esc(item.textLabel||'')}" oninput="setText('${item.id}_text', this.value)">${esc(w.answers[item.id+'_text']||'')}</textarea>` : ''}
  </div>`;
}

function setScale(id, n){ S.wizard.answers[id]=n; S.wizard.errors={}; render(); }
function setChoice(id, val){
  const w = S.wizard;
  w.answers[id] = w.answers[id]===val ? null : val;
  if (id === 'info_erhalten' && w.answers[id] !== 'ja'){ w.answers.info_wie = null; }
  w.errors = {};
  render();
}
function setText(id, val){ S.wizard.answers[id] = val; }

function sectionComplete(sec){
  const w = S.wizard;
  return sec.items.every(item=>{
    if (item.showIf && !item.showIf(w.answers)) return true; // ausgeblendete Fragen nicht verlangen
    const itype = item.type || (sec.scaleType ? 'scale' : 'choice');
    if (itype === 'text') return true; // optional
    const v = w.answers[item.id];
    return v !== undefined && v !== null && v !== '';
  });
}

function wizardNext(){
  const w = S.wizard;
  const sec = w.sections[w.step];
  if (!sectionComplete(sec)){
    w.errors.section = true;
    render();
    return;
  }
  w.errors = {};
  w.step++;
  render();
}
function wizardBack(){
  const w = S.wizard;
  if (w.step <= -1){ S.view='p_home'; render(); return; }
  if (w.step === 0){ w.step = -1; render(); return; }
  w.step--;
  render();
}

async function submitWizard(){
  const w = S.wizard;
  // Schutz gegen Doppel-/Mehrfachklick: ohne diese Sperre führte ein zweiter Tap
  // (z. B. weil die Seite kurz nicht reagierte) zu doppelt gespeicherten Antworten.
  if (w._submitting) return;
  w._submitting = true;
  const btn = document.getElementById('submit-btn');
  const again = document.getElementById('review-again-btn');
  if (btn){ btn.disabled = true; btn.textContent = 'Wird gesendet …'; }
  if (again){ again.disabled = true; again.style.opacity = '.5'; }

  try{
    const r = S.currentRound;
    const type = w.kind === 'course' ? 'course' : ('teacher:'+slug(w.dozentName));
    await saveResponse(r.id, type, w.dozentName, w.answers);
    if (w.kind === 'course') markSubmitted('course', r.id);
    else markSubmitted('teacher', r.id, slug(w.dozentName));
    S.submittedThisSession = true;
    S._lastKind = w.kind;
    S._lastDozent = w.dozentName;
    S.view = 'p_done';
    render();
  }catch(e){
    w._submitting = false;
    if (btn){ btn.disabled = false; btn.textContent = 'Jetzt absenden'; }
    if (again){ again.disabled = false; again.style.opacity = '1'; }
    toast('Senden hat nicht geklappt. Bitte erneut versuchen.');
  }
}

function renderDone(){
  const r = S.currentRound;
  let otherDozent = S._lastKind==='teacher' ? r.dozenten.find(d=>d!==S._lastDozent) : null;
  if (otherDozent && hasSubmitted('teacher', r.id, slug(otherDozent))) otherDozent = null;
  const courseDone = hasSubmitted('course', r.id);
  return `<div class="wrap"><div class="center-state">
    <div class="icon-circle">${ICONS.check}</div>
    <h1>Vielen Dank!</h1>
    <p>Ihre anonyme Bewertung wurde erfolgreich übermittelt.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
      ${S._lastKind==='course' && r.dozenten.length ? `<button class="btn btn-primary btn-block" onclick="goTeacherPick()">Jetzt Dozent:in bewerten</button>` : ''}
      ${otherDozent ? `<button class="btn btn-primary btn-block" onclick="startTeacherEval('${esc(otherDozent).replace(/'/g,"\\'")}')">${esc(otherDozent)} bewerten</button>` : ''}
      <button class="btn btn-outline btn-block" onclick="goParticipantHome()">Zur Übersicht</button>
    </div>
  </div></div>`;
}

/* ============================= INIT ============================= */

async function init(){
  if (!apiConfigured()){
    S.view = 'setup_needed';
    render();
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const roundId = params.get('round');

  if (roundId){
    const round = await loadRound(roundId);
    if (!round){ S.view = 'not_found'; render(); return; }
    if (isExpired(round)){ S.currentRound = round; S.view = 'expired'; render(); return; }
    S.currentRound = round;
    S.currentRoundId = roundId;
    S.view = 'p_home';
    render();
  } else {
    try{ S.adminToken = localStorage.getItem(ADMIN_TOKEN_KEY) || null; }catch(e){ S.adminToken = null; }
    if (!S.adminToken){
      S.view = 'admin_login';
      render();
      return;
    }
    S.rounds = await loadRounds();
    S.view = 'admin_list';
    render();
  }
}

init();
</script>
